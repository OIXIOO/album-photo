<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#12203a;--mute:#5d6a82;--line:#d5dbe6;--accent:#2b5cff;--accent-ink:#fff;--sun:#ffc933;--page:#fff;

*{box-sizing:border-box}

input[type=text]{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}

.fmt{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;text-align:center}
.fmt[aria-pressed="true"]{border-color:var(--accent)}
.fmt span{display:block;margin:0 auto 8px;background:var(--line);border-radius:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px}
.page{container-type:inline-size}.deco{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab;line-height:1;white-space:nowrap;user-select:none;z-index:3}.deco.dsel{outline:2px dashed var(--accent);outline-offset:4px}
.tex{position:absolute;inset:0;background-size:44cqw;z-index:0;pointer-events:none}.slot{z-index:1}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}.sheet-in{background:var(--surface);width:100%;max-width:560px;margin:auto;max-height:75vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.phd{overflow:visible}.phd img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.hdl{position:absolute;right:-13px;bottom:-13px;width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid #fff;touch-action:none;z-index:5}.pvw{position:fixed;inset:0;background:#0b0f18;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px)}.pv .page{max-height:none}
.page{overflow:hidden;position:relative}.phd{overflow:hidden}.hdl{right:4px!important;bottom:4px!important}
.cropping{outline:3px solid var(--sun);outline-offset:-3px;touch-action:none}
.cropbar{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cropbar span{flex:1;font-size:14px}.cropbar .chip{color:#12203a;background:#fff}
.albs{justify-content:flex-start!important;align-items:stretch!important;overflow:auto;background:var(--bg)!important;color:var(--ink);padding:16px;max-width:560px;margin:auto}
.rot{position:absolute;top:4px;left:calc(50% - 14px);width:28px;height:28px;border-radius:50%;background:var(--sun);border:3px solid #fff;touch-action:none;z-index:5}
.bub{overflow:visible}.btxt{position:absolute;inset:14% 12%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;font-weight:700;overflow:hidden;word-break:break-word;white-space:normal}
.pnum{position:absolute;bottom:2cqw;font:700 3cqw sans-serif;color:#333;z-index:4;pointer-events:none;text-shadow:0 0 3px #fff}
.cover-title{text-align:center}
.page.bd{gap:3cqw;padding:3cqw;background-color:#fff}.page.bd .slot{border:.7cqw solid #111;border-radius:0}
.wtabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.wtabs .chip{white-space:nowrap}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}.sticky .stage{padding:4px 0}.sticky .page{max-height:none}
.page.pz{padding:0;gap:0}.svgi{overflow:visible}.svgi svg{width:100%;height:100%;display:block;pointer-events:none}
.stage{position:relative}.sticky .stage{padding:34px 22px 22px}.sticky .page{touch-action:none}
.hbtn{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;border:3px solid #fff;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.45);padding:0}
.hres{background:var(--accent);color:#fff}.hrot{background:var(--sun);color:#12203a}
.selbar{display:flex;gap:6px;padding:2px 0 6px}.sb{flex:1;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;color:var(--ink)}.sb small{font-size:11px;color:var(--mute)}.sb.danger small{color:#ff3b30}
.page{background-color:#fffffd;border-radius:3px;box-shadow:0 1px 0 #e4e4e0,0 2px 0 #dadad5,0 3px 0 #cfcfca,0 12px 26px rgba(0,0,0,.38)}
.page.sp-l{border-radius:3px 8px 8px 3px}.page.sp-r{border-radius:8px 3px 3px 8px}
.page.sp-l::after,.page.sp-r::after{content:"";position:absolute;top:0;bottom:0;width:7cqw;z-index:8;pointer-events:none}
.page.sp-l::after{left:0;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,.08) 45%,transparent)}

.top{display:flex;align-items:center;gap:6px;height:60px;padding:6px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);font-size:20px;display:grid;place-items:center;flex:none;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}.ib:disabled{opacity:.3}
.ttlbtn{flex:1;min-width:0;text-align:left;font:700 19px "Bricolage Grotesque","DM Sans",system-ui,sans-serif;border:0;background:none;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;letter-spacing:-.01em}
.sticky{top:calc(60px + env(safe-area-inset-top,0px))}
.chip{min-height:44px;padding:10px 16px}

.albs .btn[data-act="albcreate"]{position:sticky;bottom:10px}
.albs h1{font-size:23px;margin:6px 0 0}
.pvw{z-index:40}.sheet{z-index:45}.tile:first-child{grid-column:span 2;min-height:110px}

<body>
<header class="top">
  <button class="ib" data-act="home" aria-label="Accueil">🏠</button>
  <button class="ttlbtn" id="ttl" data-act="rename" aria-label="Renommer">Mon album</button>
  <button class="ib" id="bUndo" data-act="undo" aria-label="Annuler" disabled>↶</button>
  <button class="ib" id="bRedo" data-act="redo" aria-label="Rétablir" disabled>↷</button>
  <button class="ib" data-act="preview" aria-label="Aperçu du livre">👁</button>
  <p id="sub" hidden></p><p id="sv" hidden></p>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<input id="file" class="sr" type="file" accept="image/*" multiple>
<input id="pgfile" class="sr" type="file" accept="image/*" multiple>
<input id="pfile" class="sr" type="file" accept=".json,.album,application/json">

<script>
var FILTERS=[["Original",""],["Noir et blanc","grayscale(1) contrast(1.05)"],["Sépia","sepia(.65)"],["Éclat","saturate(1.45) contrast(1.06)"],["Doux","brightness(1.06) saturate(.85)"]];
var LAYOUTS={
 un:{n:1,cols:"1fr",rows:"1fr",areas:['"a"']},
 deuxH:{n:2,cols:"1fr",rows:"1fr 1fr",areas:['"a"','"b"']},
 deuxV:{n:2,cols:"1fr 1fr",rows:"1fr",areas:['"a b"']},
 trois:{n:3,cols:"1fr 1fr",rows:"1.4fr 1fr",areas:['"a a"','"b c"']},
 quatre:{n:4,cols:"1fr 1fr",rows:"1fr 1fr",areas:['"a b"','"c d"']},
 bd3:{n:3,cols:"1fr",rows:"1fr 1fr 1fr",areas:['"a"','"b"','"c"']},
 bd5:{n:5,cols:"1fr 1fr",rows:"1fr 1.2fr 1fr",areas:['"a b"','"c c"','"d e"']},
 bd6:{n:6,cols:"1fr 1fr",rows:"1fr 1fr 1fr",areas:['"a b"','"c d"','"e f"']},
 bdL:{n:4,cols:"1fr 1fr",rows:"1fr 1fr 1fr",areas:['"a b"','"a c"','"a d"']},
 libre:{n:0,cols:"1fr",rows:"1fr",areas:['"a"']}
};
var RATIO={portrait:"3/4",paysage:"4/3",carre:"1/1"};
var S={tab:"photos",fmt:"portrait",title:"Mon album",photos:[],pages:[{layout:"un",slots:[null]}],cur:0,sel:0,toast:""};
var $=function(id){return document.getElementById(id)};
function toast(t){S.toast=t;render();setTimeout(function(){S.toast="";render()},1800)}
function pad(a,n){a=a.slice(0,n);while(a.length<n)a.push(null);return a}
function photo(id){for(var i=0;i<S.photos.length;i++)if(S.photos[i].id===id)return S.photos[i];return null}
function used(id){var c=0;S.pages.forEach(function(p){p.slots.forEach(function(s){if(s===id)c++})});return c}
function filt(p){return FILTERS[p.f||0][1]}

var TEXN={kraft:"Papier kraft",carton:"Carton",lin:"Tissu lin",bois:"Bois",feuille:"Feuilles",ecorce:"Écorce",nuage:"Nuages",sable:"Sable",mer:"Mer"};
var EMO={"Animaux":["🐘","🦋","🐢","🐠","🦜","🦊","🐶","🐱","🐝","🦁","🐬","🐞"],"Nature":["🌿","🍃","🍂","🌸","🌴","🌊","☁️","🌙","🌈","🍄","🐚","⛰️"],"Voyage":["✈️","📍","🏖️","⛵","🚗","📷","🧳","🗺️","🏕️","🎒"],"Fête":["🎉","🎂","🎈","🎁","💍","👶","🥂","🎄"],"Cœurs":["❤️","💕","⭐","✨","😊","🌞","💌"]};
var TEXC={},TEXU={};
function texCanvas(k){
  if(TEXC[k])return TEXC[k];
  var c=document.createElement("canvas");c.width=c.height=128;var x=c.getContext("2d"),sd=7,i;
  for(i=0;i<k.length;i++)sd=(sd*31+k.charCodeAt(i))%4294967296;
  function R(){sd=(sd*1664525+1013904223)%4294967296;return sd/4294967296}
  var B={kraft:"#c9a97c",carton:"#b78c5c",lin:"#e8e1d2",bois:"#9b6a3e",feuille:"#4e8b3a",ecorce:"#5a4535",nuage:"#8ec4f0",sable:"#e9d8aa",mer:"#2b80b8"};
  x.fillStyle=B[k];x.fillRect(0,0,128,128);
  function dots(n,col,r){for(var j=0;j<n;j++){x.fillStyle=col;x.globalAlpha=.25*R()+.05;x.beginPath();x.arc(R()*128,R()*128,r*R()+.5,0,6.3);x.fill()}x.globalAlpha=1}
  function lines(n,col,vert,w){x.strokeStyle=col;x.lineWidth=w;for(var j=0;j<n;j++){x.globalAlpha=.15+.2*R();x.beginPath();var p=R()*128;if(vert){x.moveTo(p,0);x.bezierCurveTo(p+8*R(),40,p-8*R(),90,p+4*R(),128)}else{x.moveTo(0,p);x.lineTo(128,p)}x.stroke()}x.globalAlpha=1}
  if(k==="kraft"){dots(500,"#6b4a22",1.2);lines(6,"#ffffff",0,1)}
  else if(k==="carton"){lines(40,"#5a3b1b",0,1);dots(300,"#ffffff",1)}
  else if(k==="lin"){lines(32,"#9a8f78",0,1);lines(32,"#9a8f78",1,1)}
  else if(k==="bois"){lines(28,"#4a2e14",1,1.6);dots(80,"#3a2410",2)}
  else if(k==="feuille"){dots(60,"#1f4d1a",12);dots(40,"#9fd37a",9)}
  else if(k==="ecorce"){lines(30,"#1e140c",1,2.4);dots(150,"#8a6f56",1.6)}
  else if(k==="nuage"){dots(30,"#ffffff",20)}
  else if(k==="sable"){dots(700,"#9c8546",.9)}
  else if(k==="mer"){for(i=0;i<14;i++){x.strokeStyle="#bfe6ff";x.globalAlpha=.3;x.lineWidth=1.5;x.beginPath();x.arc(R()*128,R()*128,10+10*R(),3.4,6);x.stroke()}x.globalAlpha=1}
  return TEXC[k]=c}
function texURL(k){return TEXU[k]||(TEXU[k]=texCanvas(k).toDataURL("image/png"))}
var NEW=[],_sx=0,_sy=0,_sin=false;
function finishAdd(){
  var ids=NEW.slice();NEW=[];var mode=S.addMode||"lib";S.addMode=null;
  if(mode==="slot"&&ids.length){var sl=S.pages[S.cur].slots;ids.forEach(function(id){var k=sl[S.sel]?sl.indexOf(null):S.sel;if(k>-1)sl[k]=id});S.sheet=false;toast("Photo placée");return}
  if(mode==="free"&&ids.length){ids.forEach(addFree);S.sheet=false;toast("Photo ajoutée");return}
  if(mode==="page"&&ids.length){
    var order=["un","deuxH","trois","quatre"],cp=S.pages[S.cur],ci=cp.slots.every(function(q){return !q})?S.cur-1:S.cur,first=ci+1,n=0;
    while(ids.length){var ch=ids.splice(0,4),lay=order[ch.length-1],pg={layout:lay,slots:pad(ch,LAYOUTS[lay].n)};
      if(ci===first-1&&n===0&&cp.slots.every(function(q){return !q})){cp.layout=lay;cp.slots=pg.slots;ci=S.cur}else{S.pages.splice(ci+1,0,pg);ci++}n++}
    S.cur=first<0?0:Math.min(first,S.pages.length-1);S.sel=0;S.sheet=false;S.tab="pages";toast(n+" page"+(n>1?"s":"")+" créée"+(n>1?"s":""));return}
  if(S.autoNext&&S.photos.length){S.autoNext=false;if(S.kind==="bdd"){runToon(S.photos.slice(),function(){magic()})}else magic();return}
  toast("Photos ajoutées")}
$("file").addEventListener("change",function(e){
  var files=[].slice.call(e.target.files),left=files.length;NEW=[];
  e.target.value="";
  if(!left)return;
  function done(){if(--left===0)finishAdd()}
  function add(src,w,h,th,t){var id="p"+Date.now()+Math.random().toString(36).slice(2,6);S.photos.push({id:id,src:src,f:0,w:w,h:h,th:th,t:t,sx:Math.min(Math.max(w||0,h||0)||2000,S.kind==="poster"?4500:2000)});NEW.push(id)}
  files.forEach(function(f){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        try{
          var k=Math.min(1,(S.kind==="poster"?4500:2000)/Math.max(im.width,im.height)),c=document.createElement("canvas");
          c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
          c.getContext("2d").drawImage(im,0,0,c.width,c.height);
          var tk=Math.min(1,300/Math.max(im.width,im.height)),tc=document.createElement("canvas");tc.width=Math.round(im.width*tk);tc.height=Math.round(im.height*tk);tc.getContext("2d").drawImage(im,0,0,tc.width,tc.height);add(c.toDataURL("image/jpeg",.85),im.width,im.height,tc.toDataURL("image/jpeg",.6),f.lastModified);
        }catch(x){add(r.result)}
        done();
      };
      im.onerror=function(){add(r.result);done()};
      im.src=r.result;
    };
    r.onerror=done;
    r.readAsDataURL(f);
  });
});

function magic(){
  if(!S.photos.length){toast("Ajoutez d’abord des photos");return}
  var order=(S.kind==="bd"||S.kind==="bdd")?["bd3","bd5","bd6","bdL"]:["deuxH","quatre","trois","deuxV","un"],ids=S.photos.slice().sort(function(a,b){return (a.t||0)-(b.t||0)}).map(function(p){return p.id}),pages=[],k=0,i=0;
