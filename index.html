<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon album photo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b5cff">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#12203a;--mute:#5d6a82;--line:#d5dbe6;--accent:#2b5cff;--accent-ink:#fff;--sun:#ffc933;--page:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surface:#17233a;--ink:#eaf0fb;--mute:#9aa7c0;--line:#2b3a57;--accent:#6d93ff;--accent-ink:#0e1626;--page:#f4f6fa}}
:root[data-theme="dark"]{--bg:#0e1626;--surface:#17233a;--ink:#eaf0fb;--mute:#9aa7c0;--line:#2b3a57;--accent:#6d93ff;--accent-ink:#0e1626;--page:#f4f6fa}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "DM Sans",system-ui,sans-serif;max-width:560px;margin-inline:auto;min-height:100vh;padding-bottom:84px}
h1,h2{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0}
header{padding:16px 16px 8px}
header h1{font-size:26px;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--mute);font-size:14px}
main{padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}label.btn{display:inline-block}.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{font-size:17px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:0;padding:0;background:var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .n{position:absolute;right:4px;bottom:4px;background:var(--sun);color:#12203a;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.empty{color:var(--mute);text-align:center;padding:28px 12px}
.stage{display:flex;justify-content:center;padding:8px 0}
.page{background:var(--page);width:100%;box-shadow:0 6px 24px rgba(18,32,58,.25);display:grid;gap:6px;padding:6px;position:relative;max-height:56vh}
.slot{background:#dfe4ee;border:0;padding:0;overflow:hidden;position:relative;min-height:0;border-radius:2px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.sel{outline:4px solid var(--accent);outline-offset:-4px}
.slot .plus{position:absolute;inset:0;display:grid;place-items:center;color:#5d6a82;font-size:13px}
.cover-title{position:absolute;left:0;right:0;bottom:0;padding:18px 14px 12px;background:linear-gradient(transparent,rgba(10,18,34,.7));color:#fff;font:700 clamp(18px,6vw,28px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;pointer-events:none}
input[type=text]{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pager{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.pager button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px}
.lay{width:52px;height:52px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:6px;display:grid;gap:2px}
.lay i{background:var(--mute);border-radius:1px}
.lay[aria-pressed="true"]{border-color:var(--accent)}
.tray{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tray .th{flex:0 0 64px}
nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;padding:10px 4px;border-radius:12px;font-weight:500;color:var(--mute)}
nav button[aria-current="page"]{color:var(--ink);background:var(--bg);font-weight:700}
.fmt{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;text-align:center}
.fmt[aria-pressed="true"]{border-color:var(--accent)}
.fmt span{display:block;margin:0 auto 8px;background:var(--line);border-radius:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px}
.page{container-type:inline-size}.deco{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab;line-height:1;white-space:nowrap;user-select:none;z-index:3}.deco.dsel{outline:2px dashed var(--accent);outline-offset:4px}
.tex{position:absolute;inset:0;background-size:44cqw;z-index:0;pointer-events:none}.slot{z-index:1}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}.sheet-in{background:var(--surface);width:100%;max-width:560px;margin:auto;max-height:75vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.phd{overflow:visible}.phd img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.hdl{position:absolute;right:-13px;bottom:-13px;width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid #fff;touch-action:none;z-index:5}.pvw{position:fixed;inset:0;background:#0b0f18;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px)}.pv .page{max-height:none}
.page{overflow:hidden;position:relative}.phd{overflow:hidden}.hdl{right:4px!important;bottom:4px!important}
.cropping{outline:3px solid var(--sun);outline-offset:-3px;touch-action:none}
.cropbar{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cropbar span{flex:1;font-size:14px}.cropbar .chip{color:#12203a;background:#fff}
.albs{justify-content:flex-start!important;align-items:stretch!important;overflow:auto;background:var(--bg)!important;color:var(--ink);padding:16px;max-width:560px;margin:auto}
</style>
</head>
<body>
<header style="position:relative">
  <button class="chip" data-act="albopen" style="position:absolute;right:16px;top:16px">📚 Mes albums</button>
  <h1 id="ttl">Mon album photo</h1>
  <p id="sub"></p>
  <p id="sv" style="margin:2px 0 0;font-size:12px;color:var(--mute)"></p>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<input id="file" class="sr" type="file" accept="image/*" multiple>
<input id="pfile" class="sr" type="file" accept=".json,.album,application/json">

<script>
var FILTERS=[["Original",""],["Noir et blanc","grayscale(1) contrast(1.05)"],["Sépia","sepia(.65)"],["Éclat","saturate(1.45) contrast(1.06)"],["Doux","brightness(1.06) saturate(.85)"]];
var LAYOUTS={
 un:{n:1,cols:"1fr",rows:"1fr",areas:['"a"']},
 deuxH:{n:2,cols:"1fr",rows:"1fr 1fr",areas:['"a"','"b"']},
 deuxV:{n:2,cols:"1fr 1fr",rows:"1fr",areas:['"a b"']},
 trois:{n:3,cols:"1fr 1fr",rows:"1.4fr 1fr",areas:['"a a"','"b c"']},
 quatre:{n:4,cols:"1fr 1fr",rows:"1fr 1fr",areas:['"a b"','"c d"']},
 libre:{n:0,cols:"1fr",rows:"1fr",areas:['"a"']}
};
var RATIO={portrait:"3/4",paysage:"4/3",carre:"1/1"};
var S={tab:"photos",fmt:"portrait",title:"Mon album",photos:[],pages:[{layout:"un",slots:[null]}],cur:0,sel:0,toast:""};
var $=function(id){return document.getElementById(id)};
function toast(t){S.toast=t;render();setTimeout(function(){S.toast="";render()},1800)}
function pad(a,n){a=a.slice(0,n);while(a.length<n)a.push(null);return a}
function photo(id){for(var i=0;i<S.photos.length;i++)if(S.photos[i].id===id)return S.photos[i];return null}
function used(id){var c=0;S.pages.forEach(function(p){p.slots.forEach(function(s){if(s===id)c++})});return c}
function filt(p){return FILTERS[p.f||0][1]}

var TEXN={kraft:"Papier kraft",carton:"Carton",lin:"Tissu lin",bois:"Bois",feuille:"Feuilles",ecorce:"Écorce",nuage:"Nuages",sable:"Sable",mer:"Mer"};
var EMO={"Animaux":["🐘","🦋","🐢","🐠","🦜","🦊","🐶","🐱","🐝","🦁","🐬","🐞"],"Nature":["🌿","🍃","🍂","🌸","🌴","🌊","☁️","🌙","🌈","🍄","🐚","⛰️"],"Voyage":["✈️","📍","🏖️","⛵","🚗","📷","🧳","🗺️","🏕️","🎒"],"Fête":["🎉","🎂","🎈","🎁","💍","👶","🥂","🎄"],"Cœurs":["❤️","💕","⭐","✨","😊","🌞","💌"]};
var TEXC={},TEXU={};
function texCanvas(k){
  if(TEXC[k])return TEXC[k];
  var c=document.createElement("canvas");c.width=c.height=128;var x=c.getContext("2d"),sd=7,i;
  for(i=0;i<k.length;i++)sd=(sd*31+k.charCodeAt(i))%4294967296;
  function R(){sd=(sd*1664525+1013904223)%4294967296;return sd/4294967296}
  var B={kraft:"#c9a97c",carton:"#b78c5c",lin:"#e8e1d2",bois:"#9b6a3e",feuille:"#4e8b3a",ecorce:"#5a4535",nuage:"#8ec4f0",sable:"#e9d8aa",mer:"#2b80b8"};
  x.fillStyle=B[k];x.fillRect(0,0,128,128);
  function dots(n,col,r){for(var j=0;j<n;j++){x.fillStyle=col;x.globalAlpha=.25*R()+.05;x.beginPath();x.arc(R()*128,R()*128,r*R()+.5,0,6.3);x.fill()}x.globalAlpha=1}
  function lines(n,col,vert,w){x.strokeStyle=col;x.lineWidth=w;for(var j=0;j<n;j++){x.globalAlpha=.15+.2*R();x.beginPath();var p=R()*128;if(vert){x.moveTo(p,0);x.bezierCurveTo(p+8*R(),40,p-8*R(),90,p+4*R(),128)}else{x.moveTo(0,p);x.lineTo(128,p)}x.stroke()}x.globalAlpha=1}
  if(k==="kraft"){dots(500,"#6b4a22",1.2);lines(6,"#ffffff",0,1)}
  else if(k==="carton"){lines(40,"#5a3b1b",0,1);dots(300,"#ffffff",1)}
  else if(k==="lin"){lines(32,"#9a8f78",0,1);lines(32,"#9a8f78",1,1)}
  else if(k==="bois"){lines(28,"#4a2e14",1,1.6);dots(80,"#3a2410",2)}
  else if(k==="feuille"){dots(60,"#1f4d1a",12);dots(40,"#9fd37a",9)}
  else if(k==="ecorce"){lines(30,"#1e140c",1,2.4);dots(150,"#8a6f56",1.6)}
  else if(k==="nuage"){dots(30,"#ffffff",20)}
  else if(k==="sable"){dots(700,"#9c8546",.9)}
  else if(k==="mer"){for(i=0;i<14;i++){x.strokeStyle="#bfe6ff";x.globalAlpha=.3;x.lineWidth=1.5;x.beginPath();x.arc(R()*128,R()*128,10+10*R(),3.4,6);x.stroke()}x.globalAlpha=1}
  return TEXC[k]=c}
function texURL(k){return TEXU[k]||(TEXU[k]=texCanvas(k).toDataURL("image/png"))}
var NEW=[],_sx=0,_sy=0,_sin=false;
function finishAdd(){
  var ids=NEW.slice();NEW=[];var mode=S.addMode||"lib";S.addMode=null;
  if(mode==="slot"&&ids.length){var sl=S.pages[S.cur].slots;ids.forEach(function(id){var k=sl[S.sel]?sl.indexOf(null):S.sel;if(k>-1)sl[k]=id});S.sheet=false;toast("Photo placée");return}
  if(mode==="free"&&ids.length){ids.forEach(addFree);S.sheet=false;toast("Photo ajoutée");return}
  if(mode==="page"&&ids.length){
    var order=["un","deuxH","trois","quatre"],cp=S.pages[S.cur],ci=cp.slots.every(function(q){return !q})?S.cur-1:S.cur,first=ci+1,n=0;
    while(ids.length){var ch=ids.splice(0,4),lay=order[ch.length-1],pg={layout:lay,slots:pad(ch,LAYOUTS[lay].n)};
      if(ci===first-1&&n===0&&cp.slots.every(function(q){return !q})){cp.layout=lay;cp.slots=pg.slots;ci=S.cur}else{S.pages.splice(ci+1,0,pg);ci++}n++}
    S.cur=first<0?0:Math.min(first,S.pages.length-1);S.sel=0;S.sheet=false;S.tab="pages";toast(n+" page"+(n>1?"s":"")+" créée"+(n>1?"s":""));return}
  if(S.autoNext&&S.photos.length){S.autoNext=false;magic();return}
  toast("Photos ajoutées")}
$("file").addEventListener("change",function(e){
  var files=[].slice.call(e.target.files),left=files.length;NEW=[];
  e.target.value="";
  if(!left)return;
  function done(){if(--left===0)finishAdd()}
  function add(src,w,h,th,t){var id="p"+Date.now()+Math.random().toString(36).slice(2,6);S.photos.push({id:id,src:src,f:0,w:w,h:h,th:th,t:t});NEW.push(id)}
  files.forEach(function(f){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        try{
          var k=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement("canvas");
          c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
          c.getContext("2d").drawImage(im,0,0,c.width,c.height);
          var tk=Math.min(1,300/Math.max(im.width,im.height)),tc=document.createElement("canvas");tc.width=Math.round(im.width*tk);tc.height=Math.round(im.height*tk);tc.getContext("2d").drawImage(im,0,0,tc.width,tc.height);add(c.toDataURL("image/jpeg",.85),im.width,im.height,tc.toDataURL("image/jpeg",.6),f.lastModified);
        }catch(x){add(r.result)}
        done();
      };
      im.onerror=function(){add(r.result);done()};
      im.src=r.result;
    };
    r.onerror=done;
    r.readAsDataURL(f);
  });
});

function magic(){
  if(!S.photos.length){toast("Ajoutez d’abord des photos");return}
  var order=["deuxH","quatre","trois","deuxV","un"],ids=S.photos.slice().sort(function(a,b){return (a.t||0)-(b.t||0)}).map(function(p){return p.id}),pages=[],k=0,i=0;
  pages.push({layout:"un",slots:[ids[k++]]});
  while(k<ids.length){var l=order[i++%order.length],n=LAYOUTS[l].n;var sl=ids.slice(k,k+n);k+=n;pages.push({layout:l,slots:pad(sl,n)})}
  S.pages=pages;S.cur=0;S.sel=0;S.tab="pages";toast(pages.length+" pages créées");
}
function setLayout(l){var p=S.pages[S.cur];
  if(l==="libre"){var R=RECT[p.layout]||[];p.deco=p.deco||[];p.slots.forEach(function(id,i){if(id&&R[i]){var r=R[i];p.deco.push({t:"photo",pid:id,x:r[0]+r[2]/2,y:r[1]+r[3]/2,w:r[2]*.94,h:r[3]*.94})}});p.slots=[];p.layout="libre";S.sel=0;S.dsel=null;render();return}
  p.layout=l;p.slots=pad(p.slots,LAYOUTS[l].n);if(S.sel>=LAYOUTS[l].n)S.sel=0;render()}
function usedOn(id){var r=[];S.pages.forEach(function(p,i){if(p.slots.indexOf(id)>-1||(p.deco||[]).some(function(o){return o.t==="photo"&&o.pid===id}))r.push(i)});return r}
function usedBadge(id){var u=usedOn(id);return u.length?'<span class="n">p. '+u.map(function(i){return i?i:"C"}).join(", ")+'</span>':''}
function curPhoto(){var p=S.pages[S.cur],o=(p.deco||[])[S.dsel];if(o&&o.t==="photo")return photo(o.pid);return p.slots[S.sel]?photo(p.slots[S.sel]):null}
function addFree(id){var ph=photo(id),A={portrait:.75,paysage:1.3333,carre:1}[S.fmt],ar=ph&&ph.w&&ph.h?ph.w/ph.h:1,w=.5,h=w*A/ar;if(h>.9){h=.9;w=h*ar/A}dec().push({t:"photo",pid:id,x:.5,y:.5,w:w,h:h});S.dsel=dec().length-1}
function place(id){
  var p=S.pages[S.cur],i=S.sel;
  if(p.slots[i]!=null){var e=p.slots.indexOf(null);if(e>-1&&S.sel==null)i=e}
  p.slots[i]=id;
  var nx=p.slots.indexOf(null);if(nx>-1)S.sel=nx;
  render();
}
function addPage(){S.pages.push({layout:"deuxH",slots:[null,null]});S.cur=S.pages.length-1;S.sel=0;render()}
function delPage(){if(S.pages.length<2){toast("Il faut au moins une page");return}S.pages.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);S.sel=0;render()}

function pageHTML(p,idx,interactive,th){
  var L=LAYOUTS[p.layout],names="abcd",h='<div class="page" style="aspect-ratio:'+RATIO[S.fmt]+';grid-template-columns:'+L.cols+';grid-template-rows:'+L.rows+';grid-template-areas:'+L.areas.join(" ").replace(/"/g,"'")+'">';
  if(p.bg&&TEXN[p.bg])h+='<div class="tex" style="background-image:url('+texURL(p.bg)+')"></div>';
  for(var i=0;i<L.n;i++){
    var ph=p.slots[i]?photo(p.slots[i]):null;
    var tg=interactive?"button":"div";
    h+='<'+tg+' class="slot'+(interactive&&S.sel===i?' sel':'')+(interactive&&S.crop&&S.crop.k==="s"&&S.crop.i===i?' cropping':'')+'" style="grid-area:'+names[i]+'" '+(interactive?'data-slot="'+i+'" aria-label="Emplacement '+(i+1)+'"':'')+'>'+(ph?'<img alt="" src="'+(th&&ph.th?ph.th:ph.src)+'" style="'+cstyle(p.cr&&p.cr[ph.id])+'filter:'+filt(ph)+'">':'<span class="plus">'+(interactive?'Touchez pour choisir une photo':'')+'</span>')+'</'+tg+'>';
  }
  (p.deco||[]).forEach(function(o,j){
    var sel=interactive&&S.dsel===j,hd=sel?'<span class="hdl" data-h="'+j+'" aria-label="Redimensionner"></span>':'';
    if(o.t==="photo"){var ph2=photo(o.pid);if(!ph2)return;
      h+='<div class="deco phd'+(sel?' dsel':'')+(interactive&&S.crop&&S.crop.k==='d'&&S.crop.i===j?' cropping':'')+'" '+(interactive?'data-d="'+j+'"':'')+' style="left:'+o.x*100+'%;top:'+o.y*100+'%;width:'+o.w*100+'%;height:'+o.h*100+'%"><img alt="" src="'+(th&&ph2.th?ph2.th:ph2.src)+'" style="'+cstyle(o.c)+'filter:'+filt(ph2)+'">'+hd+'</div>';return}
    h+='<div class="deco'+(sel?' dsel':'')+'" '+(interactive?'data-d="'+j+'"':'')+' style="left:'+o.x*100+'%;top:'+o.y*100+'%;font-size:'+o.s*100+'cqw'+(o.t==="text"?';color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);font-weight:700;font-family:Bricolage Grotesque,sans-serif':'')+'">'+esc(o.v)+hd+'</div>'});
  if(idx===0)h+='<div class="cover-title">'+esc(S.title)+'</div>';
  return h+'</div>';
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function viewPhotos(){
  var h='<div class="card"><h2>Vos photos</h2><div class="row"><label class="btn" for="file" data-act="libphotos">Ajouter des photos</label><button class="btn ghost" data-act="magic">Album automatique (chronologique)</button></div></div>';
  if(!S.photos.length)return h+'<div class="empty">Aucune photo pour l’instant.<br>Ajoutez-en depuis votre téléphone pour commencer.</div>';
  h+='<div class="grid">';
  S.photos.forEach(function(p){var u=used(p.id);h+='<button class="th" data-del="'+p.id+'" aria-label="Retirer cette photo de la bibliothèque"><img alt="" src="'+(p.th||p.src)+'">'+(u?'<span class="n">×'+u+'</span>':'')+(p.w&&!p.enh&&Math.max(p.w,p.h)<1200?'<span class="n" style="left:4px;right:auto;background:#ff7a59">Basse résolution</span>':'')+'</button>'});
  return h+'</div><p style="color:var(--mute);font-size:13px">Touchez une photo pour la retirer. Le badge indique combien de fois elle est dans l’album.</p>';
